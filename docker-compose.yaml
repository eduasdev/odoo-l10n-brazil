services:
  odoo-web:
    image: docker.io/eduasdev/odoo-l10n-brazil:18.0
    depends_on:
      odoo-db:
        condition: service_healthy   # fixes the first-boot DB race
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:-odoo}
      - HOST=odoo-db
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ../files/odoo.conf:/etc/odoo/odoo.conf:ro
    restart: unless-stopped

  odoo-db:
    image: postgres:17
    # Postgres tuning parameters
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
      -c work_mem=${PG_WORK_MEM:-4MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      -c max_connections=${PG_MAX_CONNECTIONS:-100}
      -c synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-on}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo}
      - POSTGRES_DB=${POSTGRES_DB:-odoo}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data:
  