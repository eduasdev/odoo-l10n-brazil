name: Build and push odoo-l10n-brazil

# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   - eduasdev
#   DOCKERHUB_TOKEN      - Docker Hub access token (not your account password)
#
# Optional, only needed if you want this workflow to also trigger a Dokploy
# redeploy after pushing the image (Dokploy's Docker Hub auto-deploy webhook
# only supports the "Application" service type, not Compose, so for Compose
# services the API call below is the way to do it):
#   DOKPLOY_DOMAIN       - e.g. dokploy.yourdomain.com (no scheme)
#   DOKPLOY_API_TOKEN    - API token from your Dokploy profile settings
#   DOKPLOY_COMPOSE_ID   - the composeId of the odoo-l10n-brazil service
#
# Branching convention (mirrors OCA's own l10n-brazil repo): the repo name
# carries no version number. Each supported Odoo major version lives on its
# own branch (18.0 today, 19.0 whenever that lands), and this workflow tags
# the image after the branch it built from instead of a flat "latest".

on:
  push:
    branches: ["*.0"]  # 18.0, 19.0, etc.
    paths:
      - "Dockerfile"
      - "scripts/**"

env:
  IMAGE: docker.io/eduasdev/odoo-l10n-brazil

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy redeploy
        if: ${{ secrets.DOKPLOY_API_TOKEN != '' }}
        run: |
          curl -fsS -X POST "https://${{ secrets.DOKPLOY_DOMAIN }}/api/compose.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"${{ secrets.DOKPLOY_COMPOSE_ID }}\"}"
