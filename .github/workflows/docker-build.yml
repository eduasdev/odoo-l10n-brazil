name: Build and push odoo-l10n-brazil

# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   - eduasdev
#   DOCKERHUB_TOKEN      - Docker Hub access token (not your account password)
#
# Optional – only needed to auto-trigger a Dokploy redeploy after the push
# (Dokploy's Docker Hub webhook only works for Application services, not
# Compose, so for Compose stacks the API call below is the way to do it):
#   DOKPLOY_DOMAIN       - e.g. dokploy.yourdomain.com (no scheme)
#   DOKPLOY_API_TOKEN    - API token from your Dokploy profile settings
#   DOKPLOY_COMPOSE_ID   - the composeId of the odoo-l10n-brazil service
#
# Branching convention (mirrors OCA's own l10n-brazil repo): the repo name
# carries no version number. Each supported Odoo major version lives on its
# own branch (18.0 today, 19.0 whenever that lands), and this workflow tags
# the image after the branch it built from instead of a flat "latest".
#
# Build strategy: two parallel native-runner jobs (amd64 + arm64) each push
# their image by digest, then a merge job assembles the multi-arch manifest.
# This is ~10x faster than building arm64 via QEMU on a single runner.

on:
  push:
    branches: ["*.0"]  # 18.0, 19.0, etc.
    paths:
      - "Dockerfile"
      - "scripts/**"
      - "modules.lock"
      - "VERSION"
  workflow_dispatch:

env:
  IMAGE: docker.io/eduasdev/odoo-l10n-brazil

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Prepare platform slug
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ODOO_VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,scope=build-${{ env.PLATFORM_SLUG }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests and push tags
    runs-on: ubuntu-latest
    needs: build
    env:
      DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}

    steps:
      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ github.ref_name }} \
            --tag ${{ env.IMAGE }}:${{ github.ref_name }}-${{ github.sha }} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Trigger Dokploy redeploy
        if: env.DOKPLOY_API_TOKEN != ''
        run: |
          curl -fsS -X POST "https://${{ secrets.DOKPLOY_DOMAIN }}/api/compose.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"${{ secrets.DOKPLOY_COMPOSE_ID }}\"}"
